name: Desktop

# Builds the native Tauri installers for Linux and Windows.
#
# - `workflow_dispatch`: build on demand and download the installers from the
#   run summary (Artifacts section).
# - `workflow_call`: reused by the Release workflow, which attaches the
#   installers to the GitHub release for a `v*` tag.
#
# The installers are self-contained: `scripts/desktop-stage.mjs` embeds the
# Next.js standalone server plus a pinned Node.js runtime, so end users do not
# need Node.js installed.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  OPSORA_NODE_MAJOR: "22"
  # Fail the build instead of silently producing installers that rely on a
  # system Node.js.
  OPSORA_REQUIRE_NODE_RUNTIME: "1"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 · AppImage / deb / rpm
            platform: ubuntu-22.04
            artifact: opsora-linux-x64
          - name: Windows x64 · NSIS / MSI
            platform: windows-latest
            artifact: opsora-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xz-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache bundled Node.js runtime
        uses: actions/cache@v4
        with:
          path: .node-runtime
          key: node-runtime-${{ runner.os }}-${{ env.OPSORA_NODE_MAJOR }}-${{ hashFiles('scripts/fetch-node-runtime.mjs') }}

      - name: Build Next.js + stage bundled server & runtime
        run: pnpm desktop:stage

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          # `beforeBuildCommand` reruns the stage script; the Next.js build is
          # already done above, so only re-copy the staged output.
          OPSORA_STAGE_SKIP_BUILD: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
